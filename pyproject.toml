[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dce2sql"
version = "0.1.0"
description = "Migrate DiscordChatExporter JSON exports into a SQL database"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "edelkas" }]
keywords = ["discord", "archive", "sqlite", "discordchatexporter"]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

dependencies = [
    # Streaming JSON, so that a multi-gigabyte channel export doesn't have to be held in memory
    "ijson>=3.2",
    # The progress display and the final report
    "rich>=13.0",
]

[project.optional-dependencies]
# Database drivers, one extra per engine. SQLite needs none: it is in the standard library,
# which is most of why it is the default.
mysql = ["PyMySQL>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
all = ["PyMySQL>=1.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
dce2sql = "dce2sql.cli:main"

[project.urls]
Homepage = "https://github.com/edelkas/dce2sql"

[tool.setuptools.packages.find]
include = ["dce2sql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
